[project]
name = "helmet"
version = "0.1.0"
description = "Continuous, evidence-grounded fantasy football intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "nflreadpy>=0.1.5",
    "prefect>=3.8.4",
    "pydantic-settings>=2.15.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
helmet = "helmet:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
